name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generated pages and sw.js are up to date (run node tools/build-pages.js if this fails)
        run: node tools/build-pages.js --check
      - name: Public JSON data is up to date (run node tools/build-api.js if this fails)
        run: node tools/build-api.js --check
      - name: Install headless Chromium
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Page loads without JavaScript errors
        run: node tools/smoke-test.js
