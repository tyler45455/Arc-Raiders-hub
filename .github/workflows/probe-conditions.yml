name: Probe official condition page
on:
  pull_request:
    paths: [".github/workflows/probe-conditions.yml", "tools/sync-conditions.js"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          curl -sSL -A "Mozilla/5.0" https://arcraiders.com/map-conditions -o "$RUNNER_TEMP/page.html"
          node tools/sync-conditions.js --html "$RUNNER_TEMP/page.html" --json "$RUNNER_TEMP/c.json" --print
          node -e 'var d=require(process.argv[1]); console.log(JSON.stringify(d.offsets), d.major.join("|")); console.log(JSON.stringify(d.rows))' "$RUNNER_TEMP/c.json"
          python3 - "$RUNNER_TEMP/page.html" <<'PY'
          import re, json, sys
          s = open(sys.argv[1], encoding='utf-8').read()
          chunks = re.findall(r'self\.__next_f\.push\(\[1,"((?:[^"\\]|\\.)*)"\]\)', s)
          f = "".join(json.loads('"' + c + '"') for c in chunks)
          for kw in ['"europe"', 'Europe', 'north-america"', 'Entries"']:
              for m in list(re.finditer(kw, f))[:4]:
                  print("--", kw, repr(f[max(0,m.start()-250):m.start()+150]))
          PY
