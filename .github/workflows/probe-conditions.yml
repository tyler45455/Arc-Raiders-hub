name: Probe condition feed
on:
  pull_request:
    paths: [".github/workflows/probe-conditions.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch MetaForge event timers
        run: |
          curl -sS -D - -H "Origin: https://tyler45455.github.io" https://metaforge.app/api/arc-raiders/event-timers -o body.json
          echo; echo "---- OPTIONS"; curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: https://tyler45455.github.io" -H "Access-Control-Request-Method: GET" https://metaforge.app/api/arc-raiders/event-timers
          echo; echo "---- BODY"; python3 -c "import json;d=json.load(open('body.json'));print(len(d['data']));[print(json.dumps({k:v for k,v in e.items() if k not in ('icon','game')})) for e in d['data']]"
